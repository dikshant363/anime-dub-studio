name: Documentation Improvement
description: Propose updates or corrections to Wiki pages, README, or API docs.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: doc-gap
    attributes:
      label: Documentation Gap / Inaccuracy
      description: What documentation is missing, out of date, or difficult to follow?
      placeholder: The setup instructions for offline MLX Whisper are missing the Apple Silicon brew path...
    validations:
      required: true
  - type: input
    id: affected-file
    attributes:
      label: Affected Document or Wiki Page
      placeholder: docs/wiki/Getting-Started.md or README.md
    validations:
      required: true
  - type: textarea
    id: proposed-content
    attributes:
      label: Proposed Content / Correction
      description: Provide the corrected or suggested markdown content.
    validations:
      required: true
