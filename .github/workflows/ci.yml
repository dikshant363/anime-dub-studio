name: CI & Build Verification

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Run Test Suite
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16 / Swift 6
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Install Multimedia Tools
        run: |
          brew install ffmpeg

      - name: Build Debug Targets
        run: |
          swift build -c debug

      - name: Run Core & Integration Test Suites
        run: |
          swift test --filter "QualityAssuranceTests|SecurityAndResilienceTests|HindiAdaptationTests|HinglishLocalizationTests|DialogueTimingTests|SpeakerSimilarityAndAccentTests|FinishedVideoWorkflowTests|PipelineIntegrationTests|ProviderCapabilitiesAndCacheTests"

      - name: Build Production Release Binary
        run: |
          swift build -c release

  release-build:
    name: Package Release DMG
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16 / Swift 6
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Install Dependencies
        run: |
          brew install ffmpeg

      - name: Build Application Bundle & DMG
        run: |
          chmod +x scripts/package_native_app.sh
          ./scripts/package_native_app.sh

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Anime Dub Studio.dmg
            dist/Anime-Dub-Studio-*.zip
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: false
