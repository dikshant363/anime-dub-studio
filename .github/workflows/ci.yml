name: CI & Build Verification

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Run Test Suite
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install ffmpeg

      - name: Verify Swift Toolchain
        run: |
          swift --version

      - name: Build Debug Targets
        run: |
          swift build -v

      - name: Run Swift Automated Tests
        run: |
          swift test -v

  release-build:
    name: Package Release DMG
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install ffmpeg create-dmg

      - name: Build Application Bundle & DMG
        run: |
          chmod +x scripts/package_native_app.sh
          ./scripts/package_native_app.sh

      - name: Compute Checksums
        run: |
          cd dist
          shasum -a 256 "Anime Dub Studio.dmg" > SHA256SUMS.txt
          zip -r "Anime-Dub-Studio-${{ github.ref_name }}-macos-arm64.zip" "Anime Dub Studio.app"
          shasum -a 256 "Anime-Dub-Studio-${{ github.ref_name }}-macos-arm64.zip" >> SHA256SUMS.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Anime Dub Studio.dmg
            dist/Anime-Dub-Studio-${{ github.ref_name }}-macos-arm64.zip
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
